[package]
name = "fileslink"
version = "0.2.0"
edition = "2021"

[workspace]
members = [
    "cli",
    "shared",
    "bot",
]

[[bin]]
name = "fileslink"
path = "src/main.rs"

[[bin]]
name = "fileslink-cli"
path = "cli/src/main.rs"

[dependencies]

# Async runtime
tokio = { version = "1.38.0", features = ["full"] }

# Web server
axum = "0.7.5"
http = "1.1.0"

# HTTP client
reqwest = {
    version = "0.12.5",
    default-features = true,
    features = ["stream", "rustls-tls"]
}

# Telegram
teloxide = { version = "0.12.2", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Encoding
base64 = "0.22.1"

# MIME detection
mime_guess = "2.0.4"

# Logging
log = "0.4.22"
pretty_env_logger = "0.5.0"

# CLI
structopt = "0.3.26"

# Workspace crates
cli = { path = "cli" }
shared = { path = "shared" }
bot = { path = "bot" }

[dev-dependencies]
assert_cmd = "2.0.8"
serial_test = "3.1.1"
nanoid = "0.4.0"
