[package]
name = "fileslink"
version = "0.2.0"
edition = "2021"

[workspace]
members = [
    "cli",
    "shared",
    "bot",
]

[[bin]]
name = "fileslink"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.38.0", features = ["full"] }

# Web server
axum = { version = "0.7.5", features = ["macros"] }
http = "1.1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = {
    version = "0.12",
    default-features = false,
    features = [
        "rustls-tls",
        "stream"
    ]
}

# Telegram
teloxide = { version = "0.12", features = ["full"] }

# Utilities
log = "0.4"
pretty_env_logger = "0.5.0"
mime_guess = "2.0.4"
base64 = "0.22"
uuid = { version = "1.9", features = ["v4", "serde"] }

# Existing CLI dependency
structopt = "0.3.26"

# Workspace crates
cli = { path = "cli" }
shared = { path = "shared" }
bot = { path = "bot" }

[dev-dependencies]
assert_cmd = "2.0.8"
serial_test = "3.1.1"
nanoid = "0.4.0"
